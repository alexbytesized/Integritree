# Phase 2 preparation and selected Phase 3 decisions approved by the researchers.
# Later-phase null values remain unresolved, never implicit library defaults.
# The original CSV is preserved; its provenance was inspected on 2026-09-18.
schema_version: 1
experiment_name: rf_vs_rf_smote
dataset:
  filename: ps_raw.csv
  source_url: https://www.kaggle.com/datasets/ealaxi/paysim1/data
  sha256: 16910f90577b0d981bf8ff289714510bb89bc71bff7d3f220f024e287e4eea6b
  row_count: 6362620
target: isFraud
split:
  training: 0.80
  validation: 0.10
  testing: 0.10
  stratified: true
seeds:
  split: 42
  model: 42
  smote: 42
preprocessing:
  # Final model order; original source columns remain in audit records only.
  features:
    - hour_of_day
    - day_of_week
    - type_CASH_IN
    - type_CASH_OUT
    - type_DEBIT
    - type_PAYMENT
    - type_TRANSFER
    - log_amount
    - is_zero_amount
    - is_merchant_origin
    - is_merchant_dest
  # hour=(step-1)%24; day=((step-1)//24)%7. No real weekday/date claim.
  time_convention: simulation_step_1_hour_0_day_0
  # Fit on training only: log_amount, hour_of_day, day_of_week.
  # Keep binary indicators 0/1; do not clip values outside the training range.
  normalization: minmax
  # Training-only medians where meaningful; unknown categories represented
  # explicitly. Stop/report malformed records or unavailable time/entity inputs;
  # never impute the target. See docs/METHODOLOGY.md for the policy details.
  missing_values: median_unknown
  # All 11 original columns, before splitting; keep the first source occurrence.
  duplicates: drop_exact
random_forest:
  # Fixed baseline now; approved bounded validation search follows Phase 4.
  n_estimators: 100
  max_depth: 20
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: sqrt
  tuning_procedure: fixed_baseline
  bootstrap: true
  class_weight: none
smote:
  # Ordinary SMOTE on floating-point encoded features; preserve synthetic fractions.
  method: smote_encoded
  sampling_ratio: 1.0
  k_neighbors: 5
scoring:
  probability_method: mean_tree_probability
  # Approved starting threshold, not a finalized validation-tuned cutoff.
  threshold: 0.5
  tie_policy: fraud
evaluation:
  # Equation 10 does not choose AP versus trapezoidal integration. Set in Phase 4.
  pr_auc_method: null
  mcnemar_method: null
  discordance_edge_policy: null
  # Approved signed symmetric comparison; calculation is implemented in Phase 4.
  # Older saved-run configurations remain unchanged and readable.
  percentage_difference: signed_over_mean
  alpha: 0.05
shap:
  output_space: null
  background_strategy: null
  background_size: null
  explanation_coverage: null
