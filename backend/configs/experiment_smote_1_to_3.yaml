# Validation-only sensitivity study added after reviewing the 1:1 validation run.
# It preserves the prepared data and all model settings except the SMOTE ratio.
schema_version: 1
experiment_name: rf_vs_rf_smote_ratio_1_to_3_validation
dataset:
  filename: ps_raw.csv
  source_url: https://www.kaggle.com/datasets/ealaxi/paysim1/data
  sha256: 16910f90577b0d981bf8ff289714510bb89bc71bff7d3f220f024e287e4eea6b
  row_count: 6362620
target: isFraud
split:
  training: 0.80
  validation: 0.10
  testing: 0.10
  stratified: true
seeds:
  split: 42
  model: 42
  smote: 42
preprocessing:
  features:
    - hour_of_day
    - day_of_week
    - type_CASH_IN
    - type_CASH_OUT
    - type_DEBIT
    - type_PAYMENT
    - type_TRANSFER
    - log_amount
    - is_zero_amount
    - is_merchant_origin
    - is_merchant_dest
  time_convention: simulation_step_1_hour_0_day_0
  normalization: minmax
  missing_values: median_unknown
  duplicates: drop_exact
random_forest:
  # Fixed to the setting inherited from the completed 1:1 validation search.
  n_estimators: 200
  max_depth: 20
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: sqrt
  tuning_procedure: fixed_baseline
  bootstrap: true
  class_weight: none
smote:
  method: smote_encoded
  # imbalanced-learn defines a float as minority / majority after resampling.
  sampling_ratio: 0.3333333333333333
  k_neighbors: 5
scoring:
  probability_method: mean_tree_probability
  threshold: 0.5
  tie_policy: fraud
evaluation:
  pr_auc_method: average_precision
  mcnemar_method: continuity_corrected
  discordance_edge_policy: exact_supplement_1_to_24_zero_p1
  undefined_metric_policy: null_with_reason
  absent_positive_pr_policy: null_with_reason
  percentage_difference: signed_over_mean
  alpha: 0.05
shap:
  output_space: probability
  background_strategy: uniform_original_training_without_replacement
  background_size: 200
  explanation_coverage: on_demand_and_sampled_global_explicit_full_job
  seed: 42
  perturbation: interventional
  global_sample_size: 1000
  additivity_tolerance: 0.000001
  positive_tolerance: 0.000000001
